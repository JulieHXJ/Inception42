# PHP-FPM configuration for WordPress

[www] 
user = www-data 
group = www-data

listen = 0.0.0.0:9000 # TCP port 9000 wait for FastCGI connections

# process manager
pm = dynamic # spawn workers on traffic demand
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
