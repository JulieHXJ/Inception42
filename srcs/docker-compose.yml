# define multiple containers (services, networks, volumes, env vars).

services:
  mariadb:
    image: mariadb
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin --protocol=socket --socket=/run/mysqld/mysqld.sock -u root -p\"$$(cat /run/secrets/mysql_root_password)\" ping --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  wordpress:
    image: wordpress
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - mysql_password
      - mysql_root_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - backend
      - frontend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c '</dev/tcp/127.0.0.1/9000'"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  


  nginx:
    image: nginx
    build: ./requirements/nginx
    container_name: nginx
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - frontend
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-kfsS",
          "https://127.0.0.1:443/"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
  
secrets:
  mysql_password:
    file: ../secrets/mysql_password.txt

  mysql_root_password:
    file: ../secrets/mysql_root_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/xhuang/data/mariadb

  wordpress_data:
    driver: local # vm local host storage
    driver_opts:
      type: none
      o: bind # Mount a file path from the host as a volume
      device: /home/xhuang/data/wordpress

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge