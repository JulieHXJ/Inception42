# define multiple containers (services, networks, volumes, env vars).

services:
  mariadb:
    build: ./requirements/mariadb
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
    restart: always

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - mysql_password
      - mysql_root_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      - mariadb
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - backend
      - frontend
    restart: always

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    depends_on:
      - wordpress
    ports:
      - "443:443"
    volumes:
      # - nginx_conf:/etc/nginx/conf.d
      - wordpress_data:/var/www/html:ro
    networks:
      - frontend
    restart: always
  
secrets:
  mysql_password:
    file: ../secrets/mysql_password.txt

  mysql_root_password:
    file: ../secrets/mysql_root_password.txt

  wp_admin_password:
    file: ../secrets/wp_admin_password.txt

  wp_user_password:
    file: ../secrets/wp_user_password.txt

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/xhuang/data/mariadb

  wordpress_data:
    driver: local # vm local host storage
    driver_opts:
      type: none
      o: bind # Mount a file path from the host as a volume
      device: /home/xhuang/data/wordpress

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge